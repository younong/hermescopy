# Project-local Codex CLI configuration.
# Credentials stay in the environment; never put tokens in this file.
model = "gpt-5.6-luna"
model_provider = "aixseek"

[model_providers.aixseek]
name = "AIXseek OpenAI Responses gateway"
base_url = "https://api.aixseek.com/relay/openai/v1"
env_key = "AIXSEEK_API_KEY"
wire_api = "responses"
requires_openai_auth = false
